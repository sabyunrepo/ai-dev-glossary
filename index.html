<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AI와 개발 용어를 쉬운 말, 생활 속 비유, 실제 예로 찾아보는 용어집">
  <meta name="theme-color" content="#f7f7f0">
  <title>AI·개발 용어 한입 사전</title>
  <link rel="stylesheet" href="styles.css?v=card-navigation-20261019">
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand">🧩 AI·개발 용어집</div></header>
    <section aria-label="용어 찾기와 보기 방식">
      <div class="toolbar">
        <label class="search"><span aria-hidden="true">🔎</span><input id="search" type="search" placeholder="토큰, HTML, 환경변수…" autocomplete="off" aria-label="용어·설명·예시 검색"></label>
        <div class="view-toggle" role="group" aria-label="보기 방식">
          <button id="indexBtn" type="button" aria-pressed="true">📚 용어 목록</button>
          <button id="slideBtn" type="button" aria-pressed="false">📖 설명 읽기</button>
        </div>
      </div>
      <details class="pathways" aria-label="목적별 학습 경로">
        <summary><strong>🧭 무엇부터 볼지 모르겠다면</strong><span class="disclosure-mark" aria-hidden="true"></span></summary>
        <div class="pathway-list" id="pathways"></div>
      </details>
      <nav class="filters" id="filters" aria-label="분야별 용어"></nav>
    </section>

    <section id="indexView" aria-label="용어 목록">
      <div class="list-head"><span id="resultCount" aria-live="polite"></span><span>눌러서 그림과 예시를 살펴보세요.</span></div>
      <div class="grid" id="grid"></div>
    </section>

    <section class="slide-wrap" id="slideView" aria-label="용어 설명 읽기">
      <button class="reading-back" type="button" id="returnIndex">← 용어 목록</button>
      <div class="path-context" id="pathContext" aria-live="polite"></div>
      <article class="slide" id="slideCard" aria-live="polite"></article>
      <div class="slide-controls"><button type="button" id="prevSlide">← 이전</button><span class="slide-count" id="slideCount" aria-live="polite">0 / 0</span><button type="button" id="nextSlide">다음 →</button></div>
    </section>
  </main>
  <script src="terms.js?v=illustrations-20261019"></script>
  <script>
    (() => {
      const terms = window.GLOSSARY_TERMS || [];
      const categories = ['전체', ...new Set(terms.map(term => term.category))];
      const learningPaths = [
        {id:'ai-basics', title:'AI는 어떻게 답하고, 왜 틀릴까요?', description:'AI 답변이 만들어지는 과정과 한계를 살펴봐요.', termIds:['t01','t04','t05','t07','t08','t09','t06']},
        {id:'prompting', title:'AI에게 원하는 답을 부탁하려면?', description:'질문을 어떻게 쓰면 좋은지 차근차근 알아봐요.', termIds:['t10','t11','t12','t13','t14']},
        {id:'website', title:'웹페이지는 어떻게 만들어져 인터넷에 보일까요?', description:'화면을 만들고 웹사이트를 공개하는 흐름을 봐요.', termIds:['t21','t22','t23','t24','t48','t47','t50']},
        {id:'ai-tools', title:'AI가 다른 도구를 쓰게 하려면?', description:'AI와 외부 서비스가 연결되는 방식을 살펴봐요.', termIds:['t37','t35','t29','t34','t36']}
      ];
      let activeCategory = '전체';
      let query = '';
      let visible = [...terms];
      let slideIndex = 0;
      let activePath = null;
      let lastListState = null;
      let focusedTermId = null;
      let restoring = false;
      let scrollFrame = 0;
      let navigationVersion = 0;
      let currentEntry = null;
      const entryCache = new Map();
      history.scrollRestoration = 'manual';
      const $ = selector => document.querySelector(selector);
      const grid = $('#grid');
      const byId = new Map(terms.map(term => [term.id, term]));
      const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const searchableText = term => [term.term, ...(term.aliases || []), term.category, term.short, term.analogy, term.example, term.note, term.illustration?.alt, term.formatExample?.label, term.formatExample?.language, term.formatExample?.code].filter(Boolean).join(' ').toLocaleLowerCase('ko');

      function matches() {
        const needle = query.toLocaleLowerCase('ko');
        return terms.filter(term => (activeCategory === '전체' || term.category === activeCategory) && (!needle || searchableText(term).includes(needle)));
      }

      function relatedLinks(term) {
        const related = (term.related || []).map(id => byId.get(id)).filter(Boolean);
        if (!related.length) return '';
        const label = activePath ? '🔗 전체 용어에서 함께 보기' : '🔗 함께 보기';
        return `<div class="related"><span class="related-label">${label}</span>${related.map(item => `<button class="related-link" type="button" data-open-term="${item.id}">${escapeHTML(item.term)}</button>`).join('')}</div>`;
      }

      function aliasesLine(term) {
        const aliases = (term.aliases || []).filter(Boolean);
        return aliases.length ? `<p class="aliases">${aliases.map(escapeHTML).join(' · ')}</p>` : '';
      }

      function sourceLinks(term) {
        const sources = (term.sources || []).filter(source => /^https:\/\//.test(source.url));
        return sources.length ? `<div class="sources">${sources.map(source => `<a href="${escapeHTML(source.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(source.label)} ↗</a>`).join('')}</div>` : '';
      }

      function formatExample(term) {
        const example = term.formatExample;
        if (!example) return '';
        const annotations = (example.annotations || []).map(item => `<li><code>${escapeHTML(item.code)}</code><span>${escapeHTML(item.text)}</span></li>`).join('');
        const readingGuide = annotations ? `<details class="format-annotations"><summary>한 줄씩 쉽게 읽기<span class="disclosure-mark" aria-hidden="true"></span></summary><ul>${annotations}</ul></details>` : '';
        const code = `<pre><code>${escapeHTML(example.code)}</code></pre>${readingGuide}<p class="format-note">${escapeHTML(example.note)}</p>`;
        return `<details class="format-example"><summary><span class="format-symbol" aria-hidden="true">🧾</span><span class="format-title"><strong>실제 작성 모습</strong><small>${escapeHTML(example.language)} · ${escapeHTML(example.label)}</small></span><span class="disclosure-mark" aria-hidden="true"></span></summary>${code}</details>`;
      }

      function illustration(term) {
        const picture = term.illustration;
        if (!picture || !/^assets\/illustrations\/t\d+\.webp$/.test(picture.src)) return '';
        return `<figure class="term-illustration"><a href="${escapeHTML(picture.src)}" target="_blank" rel="noopener" title="원본 그림 크게 보기 (새 탭)"><img src="${escapeHTML(picture.src)}" alt="${escapeHTML(picture.alt)}" width="${picture.width}" height="${picture.height}" loading="lazy" decoding="async"><span class="sr-only">원본 그림 크게 보기 (새 탭)</span></a><figcaption>그림을 누르면 크게 볼 수 있어요 ↗</figcaption></figure>`;
      }

      function card(term) {
        return `<a class="term-card" id="card-${term.id}" href="#${term.id}" data-open-term="${term.id}" aria-labelledby="title-${term.id}" aria-describedby="short-${term.id}">
          <span class="card-emoji" aria-hidden="true">${escapeHTML(term.emoji || '🧩')}</span>
          <span class="category">${escapeHTML(term.category)}</span>
          <h2 id="title-${term.id}">${escapeHTML(term.term)}</h2>
          ${aliasesLine(term)}
          <p class="short" id="short-${term.id}">${escapeHTML(term.short)}</p>
          <span class="read-more" aria-hidden="true">그림과 예시 보기 →</span>
        </a>`;
      }

      function renderFilters() {
        $('#filters').innerHTML = categories.map(category => `<button class="filter" type="button" aria-pressed="${category === activeCategory}" data-category="${escapeHTML(category)}">${category === '전체' ? '✨ ' : ''}${escapeHTML(category)}</button>`).join('');
      }

      function renderPathways() {
        $('#pathways').innerHTML = learningPaths.map(path => `<button class="pathway" type="button" data-path="${path.id}"><b>${escapeHTML(path.title)}</b><small>${escapeHTML(path.description)} · 용어 ${path.termIds.length}개</small></button>`).join('');
      }

      function updatePathContext() {
        const context = $('#pathContext');
        if (!activePath) {
          context.className = 'path-context';
          context.innerHTML = '';
          return;
        }
        context.className = 'path-context active';
        context.innerHTML = `<div><strong>🧭 ${escapeHTML(activePath.title)}</strong><p>${escapeHTML(activePath.description)} · 용어 ${visible.length}개</p></div><button type="button" data-exit-path>용어 목록으로 돌아가기</button>`;
      }

      function renderGrid() {
        visible = activePath ? activePath.termIds.map(id => byId.get(id)).filter(Boolean) : matches();
        $('#resultCount').textContent = `${visible.length}개 용어`;
        grid.innerHTML = visible.length ? visible.map(card).join('') : '<div class="empty">🔎 찾는 용어가 없어요. 다른 말로 검색해보세요.</div>';
        if (slideIndex >= visible.length) slideIndex = Math.max(0, visible.length - 1);
        renderSlide();
      }

      function renderSlide() {
        const term = visible[slideIndex];
        const card = $('#slideCard');
        card.classList.toggle('has-illustration', Boolean(term?.illustration));
        updatePathContext();
        if (!term) {
          card.innerHTML = '<p class="empty">표시할 용어가 없어요. 검색어나 분야를 바꿔보세요.</p>';
          $('#slideCount').textContent = '0 / 0';
          $('#prevSlide').disabled = true;
          $('#nextSlide').disabled = true;
          return;
        }
        card.innerHTML = `<header class="term-heading"><span class="emoji" aria-hidden="true">${escapeHTML(term.emoji || '🧩')}</span>
          <span class="category">${escapeHTML(term.category)}</span>
          <h2 tabindex="-1">${escapeHTML(term.term)}</h2>
          ${aliasesLine(term)}</header>
          ${illustration(term)}
          <p class="short">${escapeHTML(term.short)}</p>
          <section class="reading-block"><h3><span class="block-emoji" aria-hidden="true">${escapeHTML(term.analogyEmoji || '💭')}</span>비유하면</h3><p>${escapeHTML(term.analogy)}</p></section>
          <section class="reading-block example-block"><h3><span class="block-emoji" aria-hidden="true">📍</span>이럴 때 써요</h3><p>${escapeHTML(term.example)}</p></section>
          ${formatExample(term)}
          ${term.note ? `<details class="note"><summary><span>💡 알아두면 좋아요</span><span class="disclosure-mark" aria-hidden="true"></span></summary><p>${escapeHTML(term.note)}</p>${sourceLinks(term)}</details>` : ''}
          ${relatedLinks(term)}`;
        $('#slideCount').textContent = `${slideIndex + 1} / ${visible.length}`;
        $('#prevSlide').disabled = visible.length < 2 || Boolean(activePath && slideIndex === 0);
        $('#nextSlide').disabled = visible.length < 2 || Boolean(activePath && slideIndex === visible.length - 1);
      }

      function setView(showSlides) {
        $('#indexView').style.display = showSlides ? 'none' : 'block';
        $('#slideView').style.display = showSlides ? 'block' : 'none';
        $('#indexBtn').setAttribute('aria-pressed', String(!showSlides));
        $('#slideBtn').setAttribute('aria-pressed', String(showSlides));
        if (showSlides) renderSlide();
      }

      function termFromAddress() {
        try { return decodeURIComponent(location.hash.slice(1)); }
        catch { return ''; }
      }

      function addressFor(state) {
        const base = location.pathname + location.search;
        return state.view === 'term' && state.termId ? `${base}#${encodeURIComponent(state.termId)}` : base;
      }

      function snapshot() {
        const reading = $('#slideView').style.display === 'block';
        return {
          glossary: true,
          key: currentEntry?.key || `${Date.now()}-${Math.random().toString(36).slice(2)}`,
          view: reading ? 'term' : 'index',
          termId: visible[slideIndex]?.id || null,
          category: activeCategory,
          query,
          pathId: activePath?.id || null,
          scrollX: window.scrollX,
          scrollY: window.scrollY,
          filtersScroll: $('#filters').scrollLeft,
          pathsOpen: $('.pathways').open,
          openDetails: [...$('#slideCard').querySelectorAll('details')].flatMap((item, i) => item.open ? [i] : []),
          focusTermId: focusedTermId,
          listOffset: reading ? (currentEntry?.listOffset || 0) : 0,
          returnList: reading ? lastListState : null
        };
      }

      function cacheEntry() {
        if (restoring) return;
        const state = snapshot();
        if (state.view === 'index') lastListState = state;
        currentEntry = state;
        entryCache.set(state.key, state);
        return state;
      }

      function saveEntry() {
        const state = cacheEntry();
        if (state) history.replaceState(state, '', addressFor(state));
      }

      // Keep each history entry's viewport and controls, rather than only its term ID.
      function restoreEntry(state) {
        state = {...state, key:state.key || `${Date.now()}-${Math.random().toString(36).slice(2)}`};
        currentEntry = state;
        entryCache.set(state.key, state);
        restoring = true;
        cancelAnimationFrame(scrollFrame);
        scrollFrame = 0;
        const version = ++navigationVersion;
        activeCategory = categories.includes(state.category) ? state.category : '전체';
        query = typeof state.query === 'string' ? state.query : '';
        activePath = learningPaths.find(item => item.id === state.pathId) || null;
        focusedTermId = state.focusTermId || null;
        lastListState = state.view === 'index' ? state : (state.returnList || lastListState);
        $('#search').value = query;
        $('.pathways').open = Boolean(state.pathsOpen);
        renderFilters();
        visible = activePath ? activePath.termIds.map(id => byId.get(id)).filter(Boolean) : matches();
        slideIndex = Math.max(0, visible.findIndex(term => term.id === state.termId));
        renderGrid();
        setView(state.view === 'term');
        [...$('#slideCard').querySelectorAll('details')].forEach((item, i) => {
          item.open = (state.openDetails || []).includes(i);
        });
        $('#filters').scrollLeft = state.filtersScroll || 0;
        requestAnimationFrame(() => {
          if (version !== navigationVersion) return;
          if (state.view === 'index' && byId.has(focusedTermId)) {
            document.getElementById(`card-${focusedTermId}`)?.focus({preventScroll:true});
          }
          window.scrollTo({left:state.scrollX || 0, top:state.scrollY || 0, behavior:'instant'});
          requestAnimationFrame(() => {
            if (version !== navigationVersion) return;
            restoring = false;
            saveEntry();
          });
        });
      }

      function scrollToReading() {
        restoring = true;
        cancelAnimationFrame(scrollFrame);
        scrollFrame = 0;
        const version = ++navigationVersion;
        requestAnimationFrame(() => {
          if (version !== navigationVersion) return;
          $('#slideCard h2')?.focus({preventScroll:true});
          $('#slideView').scrollIntoView({block:'start', behavior:'instant'});
          requestAnimationFrame(() => {
            if (version !== navigationVersion) return;
            restoring = false;
            saveEntry();
          });
        });
      }

      function pushReadingEntry() {
        const previous = currentEntry;
        const state = snapshot();
        state.key = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        state.listOffset = previous?.view === 'index' ? 1 : (previous?.listOffset ? previous.listOffset + 1 : 0);
        state.scrollX = 0;
        state.scrollY = 0;
        state.openDetails = [];
        history.pushState(state, '', addressFor(state));
        currentEntry = state;
        entryCache.set(state.key, state);
        scrollToReading();
      }

      function returnToIndex() {
        if ($('#slideView').style.display !== 'block') return;
        saveEntry();
        const offset = history.state?.listOffset || 0;
        if (offset > 0) {
          history.go(-offset);
          return;
        }
        const state = lastListState || {
          glossary:true, view:'index', category:'전체', query:'', pathId:null,
          scrollX:0, scrollY:0, listOffset:0, returnList:null
        };
        history.replaceState(state, '', addressFor(state));
        restoreEntry(state);
      }

      function startPath(pathId) {
        const path = learningPaths.find(item => item.id === pathId);
        if (!path) return;
        saveEntry();
        activePath = path;
        activeCategory = '전체';
        query = '';
        $('#search').value = '';
        renderFilters();
        slideIndex = 0;
        renderGrid();
        setView(true);
        pushReadingEntry();
      }

      function openTerm(id) {
        if (!byId.has(id)) return;
        if ($('#indexView').style.display !== 'none') focusedTermId = id;
        saveEntry();
        activePath = null;
        activeCategory = '전체';
        query = '';
        $('#search').value = '';
        renderFilters();
        visible = terms;
        slideIndex = visible.findIndex(term => term.id === id);
        renderGrid();
        setView(true);
        pushReadingEntry();
      }

      function moveSlide(amount) {
        if (!visible.length) return;
        saveEntry();
        const previousIndex = slideIndex;
        slideIndex = activePath
          ? Math.max(0, Math.min(visible.length - 1, slideIndex + amount))
          : (slideIndex + amount + visible.length) % visible.length;
        if (slideIndex === previousIndex) return;
        renderSlide();
        pushReadingEntry();
      }

      $('#filters').addEventListener('click', event => {
        const button = event.target.closest('[data-category]');
        if (!button) return;
        activePath = null;
        activeCategory = button.dataset.category;
        slideIndex = 0;
        renderFilters();
        renderGrid();
        saveEntry();
      });
      $('#pathways').addEventListener('click', event => {
        const button = event.target.closest('[data-path]');
        if (button) startPath(button.dataset.path);
      });
      $('#search').addEventListener('input', event => {
        activePath = null;
        query = event.target.value.trim();
        slideIndex = 0;
        renderGrid();
        saveEntry();
      });
      $('.pathways').addEventListener('toggle', saveEntry);
      $('#slideCard').addEventListener('toggle', saveEntry, true);
      $('#filters').addEventListener('scroll', cacheEntry, {passive:true});
      document.addEventListener('click', event => {
        if (event.target.closest('[data-exit-path]')) {
          returnToIndex();
          return;
        }
        const target = event.target.closest('[data-open-term]');
        if (!target) return;
        // Keep normal link gestures, including opening a card in a new tab.
        if (target.matches('a') && (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey)) return;
        event.preventDefault();
        openTerm(target.dataset.openTerm);
      });
      $('#indexBtn').addEventListener('click', returnToIndex);
      $('#returnIndex').addEventListener('click', returnToIndex);
      $('#slideBtn').addEventListener('click', () => {
        if ($('#slideView').style.display === 'block' || !visible.length) return;
        saveEntry();
        setView(true);
        pushReadingEntry();
      });
      $('#prevSlide').addEventListener('click', () => moveSlide(-1));
      $('#nextSlide').addEventListener('click', () => moveSlide(1));
      document.addEventListener('keydown', event => {
        if (event.target.closest('input,textarea,button,summary,a')) return;
        if ($('#slideView').style.display === 'block') {
          if (event.key === 'ArrowRight') moveSlide(1);
          if (event.key === 'ArrowLeft') moveSlide(-1);
          if (event.key === 'Escape') returnToIndex();
        }
      });
      window.addEventListener('scroll', () => {
        if (restoring || scrollFrame) return;
        scrollFrame = requestAnimationFrame(() => { scrollFrame = 0; cacheEntry(); });
      }, {passive:true});
      window.addEventListener('pagehide', saveEntry);
      window.addEventListener('pageshow', event => {
        if (event.persisted && history.state?.glossary) restoreEntry(entryCache.get(history.state.key) || history.state);
      });
      window.addEventListener('popstate', event => {
        cacheEntry();
        if (event.state?.glossary) {
          restoreEntry(entryCache.get(event.state.key) || event.state);
          return;
        }
        const id = termFromAddress();
        const state = {
          glossary:true, view:byId.has(id) ? 'term' : 'index', termId:id,
          category:'전체', query:'', pathId:event.state?.pathId || null,
          scrollX:0, scrollY:0, listOffset:0, returnList:null
        };
        history.replaceState(state, '', addressFor(state));
        restoreEntry(state);
        if (state.view === 'term') scrollToReading();
      });

      renderPathways();
      const initialId = termFromAddress();
      if (history.state?.glossary) {
        restoreEntry(history.state);
      } else {
        renderFilters();
        activePath = learningPaths.find(item => item.id === history.state?.pathId) || null;
        visible = activePath ? activePath.termIds.map(id => byId.get(id)).filter(Boolean) : terms;
        slideIndex = Math.max(0, visible.findIndex(term => term.id === initialId));
        renderGrid();
        setView(byId.has(initialId));
        saveEntry();
        if (byId.has(initialId)) scrollToReading();
      }
    })();
  </script>
</body>
</html>
